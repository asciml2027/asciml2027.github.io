<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% assign description = page.description | default: site.description %}
{% if page.nav_id == 'home' %}
<title>{{ site.title | escape }}</title>
{% else %}
<title>{{ page.title | escape }} · {{ site.data.conference.short_name | escape }}</title>
{% endif %}
<meta name="description" content="{{ description | escape }}">
<meta name="theme-color" content="#203b49">
{% if site.noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}
<link rel="icon" href="{% include asset-url.html path='images/favicon.svg' %}" type="image/svg+xml">
<link rel="stylesheet" href="{% include asset-url.html path='css/main.css' %}">
<meta property="og:type" content="website">
<meta property="og:locale" content="en_GB">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:title" content="{% if page.nav_id == 'home' %}{{ site.title | escape }}{% else %}{{ page.title | escape }} · {{ site.data.conference.short_name | escape }}{% endif %}">
<meta property="og:description" content="{{ description | escape }}">
{% if site.url != '' %}
<link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{% include asset-url.html path=site.data.photo.path absolute=true %}">
<meta property="og:image:alt" content="{{ site.data.photo.alt | escape }}">
{% endif %}
